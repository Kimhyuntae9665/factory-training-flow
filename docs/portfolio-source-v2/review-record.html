const result=document.querySelector("#learning-review-result");const find=id=>document.querySelector("#learning-"+id);function setBusy(){find("approve").disabled=true;find("reject").disabled=true;}  function renderDocs(target, docs, columns = false) { const wrapper = element('div', undefined, columns ? 'learning-evidence-grid' : 'learning-document-list'); for (const doc of docs) { const box = element('div', undefined, 'learning-source'); box.append(element('strong', doc.title), element('p', `${doc.id} · v${doc.version} · ${doc.section} · ${doc.status === 'current' ? '현행' : '구버전 제외'}`, 'learning-meta'), element('p', doc.text)); wrapper.append(box); } target.append(wrapper); }
  function renderReview(review) {
    result.replaceChildren();
    const meta = element('div', undefined, 'learning-review-meta');
